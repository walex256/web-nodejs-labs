<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавление и удаление товаров</title>
  <link rel="stylesheet" href="/lab7/styles.css">
  <link rel="stylesheet" href="/lab9/styles.css">
</head>
<body>
  <main class="app">
    <nav><a href="../">К списку заданий</a></nav>
    <h1>Добавление и удаление товаров</h1>
    <form id="add" class="panel">
      <label class="field">Название <input name="title" maxlength="255" required></label>
      <label class="field">Цена, ₽ <input name="price" type="number" min="0" max="21474836.47" step="0.01" required></label>
      <label class="field">Остаток, шт. <input name="amount" type="number" min="0" max="2147483647" step="1" required></label>
      <button>Сохранить в БД</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <div id="products" class="products"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
