<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сводка склада и поиск</title>
  <link rel="stylesheet" href="/lab7/styles.css">
  <link rel="stylesheet" href="/lab9/styles.css">
</head>
<body>
  <main class="app">
    <nav><a href="../">К списку заданий</a></nav>
    <h1>Сводка склада и поиск</h1>
    <p id="stock" class="panel"></p>
    <form id="search" class="panel">
      <label class="field">Название товара <input name="q" maxlength="255" placeholder="Например, кабель"></label>
      <button>Найти</button>
      <button type="button" id="show-all">Показать все</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <div id="products" class="products"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
