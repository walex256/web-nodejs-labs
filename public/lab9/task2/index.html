<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление товарами</title>
  <link rel="stylesheet" href="/lab7/styles.css">
  <link rel="stylesheet" href="/lab9/styles.css">
</head>
<body>
  <main class="app">
    <nav><a href="../">К списку заданий</a></nav>
    <h1>Управление товарами</h1>
    <p id="stock" class="panel"></p>
    <form id="lookup" class="panel">
      <label class="field">ID товара
        <input name="id" type="number" min="1" max="2147483647" step="1" placeholder="Пустое поле показывает все товары">
      </label>
      <button>Найти по ID</button>
      <button type="button" id="show-all">Показать все</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <div id="products" class="products"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
