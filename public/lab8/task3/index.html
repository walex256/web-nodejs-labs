<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблица матчей ЧМ-2022</title>
  <link rel="stylesheet" href="/lab7/styles.css">
  <link rel="stylesheet" href="/lab8/styles.css">
</head>
<body>
  <main class="app wide">
    <nav><a href="../">К списку заданий</a></nav>
    <h1>Таблица матчей ЧМ-2022</h1>
    <section class="panel">
      <button type="button" id="build">Сформировать таблицу</button>
      <p id="status" class="status" role="status"></p>
      <ul class="legend">
        <li class="draw">Ничья</li>
        <li class="first-wins">Победа команды 1</li>
        <li class="second-wins">Победа команды 2</li>
      </ul>
      <div class="table-scroll" role="region" aria-label="Таблица матчей" tabindex="0">
        <table>
          <thead>
            <tr>
              <th scope="col">Группа</th>
              <th scope="col">Дата</th>
              <th scope="col">Время</th>
              <th scope="col">Команда 1</th>
              <th scope="col">Итоговый счёт</th>
              <th scope="col">Команда 2</th>
              <th scope="col">Стадион</th>
            </tr>
          </thead>
          <tbody id="matches"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
